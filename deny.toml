# QUEUE #197 / RFC-0095 — cargo-deny (informational CI job, not a merge gate).

[graph]
all-features = false

[advisories]
yanked = "warn"
unmaintained = "none"
ignore = [
    { id = "RUSTSEC-2026-0253", reason = "lru 0.16 via rqrr; unsound only with panicking Drop + catch_unwind" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    "NCSA",
    "MPL-2.0",
    "BSL-1.0",
    "MIT-0",
    "Unlicense",
    "OFL-1.1",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
crate = "epaint"
allow = ["LicenseRef-UFL-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
