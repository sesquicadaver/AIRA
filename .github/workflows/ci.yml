name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt-clippy-test-schema-c0-c1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@35d8a35b823d6c20db516f5c35eb0a9640942c17 # 1.94.0
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # QUEUE #45 / Analyze-80: fail on aira-core→node/peer/CSU, CSU→CSU, or import cycles.
      - name: dependency firewall
        run: |
          python3 scripts/dep_firewall.py --self-test
          python3 scripts/dep_firewall.py

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # QUEUE #38 / Analyze-73: AIRA contract, not only Rust.
      # Non-zero exit if fixtures fail or C0/C1 report failed > 0. C2 is a separate job (#117).
      - name: schema fixtures
        run: cargo run -p aira-cli --locked -- schema validate --fixtures fixtures

      - name: conformance C0
        run: cargo run -p aira-cli --locked -- conformance run --profile C0 --out "${{ runner.temp }}/aira-c0"

      - name: conformance C1
        run: cargo run -p aira-cli --locked -- conformance run --profile C1 --out "${{ runner.temp }}/aira-c1"

  conformance-c2:
    name: conformance-c2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@35d8a35b823d6c20db516f5c35eb0a9640942c17 # 1.94.0
        with:
          toolchain: 1.94.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # QUEUE #117 / Analyze-152: partial C2 regression gate (Phase F F4).
      - name: conformance C2
        run: cargo run -p aira-cli --locked -- conformance run --profile C2 --out "${{ runner.temp }}/aira-c2"

  # QUEUE #164 / Analyze-199: optional local C3 regression (NOT a merge gate).
  # Do not add `conformance-c3` to branch-protection required checks.
  conformance-c3:
    name: conformance-c3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@35d8a35b823d6c20db516f5c35eb0a9640942c17 # 1.94.0
        with:
          toolchain: 1.94.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: conformance C3 (optional / non-gate)
        run: cargo run -p aira-cli --locked -- conformance run --profile C3 --out "${{ runner.temp }}/aira-c3"

  # QUEUE #197 / Analyze-232: supply-chain licenses/advisories (NOT a merge gate).
  # Do not add `cargo-deny` to branch-protection required checks.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: cargo deny (optional / non-gate)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
