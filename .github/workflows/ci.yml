name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt-clippy-test-schema-c0-c1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: none

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # QUEUE #45 / Analyze-80: fail on aira-core→node/peer/CSU, CSU→CSU, or import cycles.
      - name: dependency firewall
        run: |
          python3 scripts/dep_firewall.py --self-test
          python3 scripts/dep_firewall.py

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # QUEUE #38 / Analyze-73: AIRA contract, not only Rust.
      # Non-zero exit if fixtures fail or C0/C1 report failed > 0. C2 is out of this row.
      - name: schema fixtures
        run: cargo run -p aira-cli --locked -- schema validate --fixtures fixtures

      - name: conformance C0
        run: cargo run -p aira-cli --locked -- conformance run --profile C0 --out "${{ runner.temp }}/aira-c0"

      - name: conformance C1
        run: cargo run -p aira-cli --locked -- conformance run --profile C1 --out "${{ runner.temp }}/aira-c1"
