[package]
name = "aira-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AIRA CLI"

[[bin]]
name = "aira"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
aira-schema = { path = "../aira-schema" }
aira-csu = { path = "../aira-csu" }
aira-flow = { path = "../aira-flow" }
aira-conformance = { path = "../aira-conformance" }
aira-object = { path = "../aira-object" }
aira-peer = { path = "../aira-peer" }
aira-protocol = { path = "../aira-protocol" }
aira-csu-model-inventory = { path = "../../csu/model-inventory" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
