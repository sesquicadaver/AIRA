[package]
name = "aira-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AIRA Desktop GUI (Developer Preview) — Status / Settings / P1 invite / Quit"

[[bin]]
name = "aira-desktop"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
eframe = { version = "0.28", default-features = true }
egui = "0.28"
rfd = "0.14"
aira-desktop-runtime = { path = "../aira-desktop-runtime" }
aira-protocol = { path = "../aira-protocol" }
aira-peer = { path = "../aira-peer" }
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }
image = { version = "0.25.6", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
aira-object = { path = "../aira-object" }
aira-peer = { path = "../aira-peer" }
aira-protocol = { path = "../aira-protocol" }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
